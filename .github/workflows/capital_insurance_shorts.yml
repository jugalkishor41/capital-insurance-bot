name: Capital Insurance - Shorts (3x daily)

on:
  schedule:
    - cron: '30 2 * * *'    # 8:00 AM IST
    - cron: '30 7 * * *'    # 1:00 PM IST
    - cron: '30 14 * * *'   # 8:00 PM IST
  workflow_dispatch: {}      # allows manual "Run workflow" button for testing

jobs:
  upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg + Hindi fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore client_secrets.json
        run: echo '${{ secrets.CLIENT_SECRETS }}' > client_secrets.json

      - name: Restore youtube_token.pkl
        run: echo "${{ secrets.YOUTUBE_TOKEN_B64 }}" | tr -d ' \t\r\n' | base64 -d > youtube_token.pkl

      - name: Run bot (Shorts)
        env:
          GEMINI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python capital_insurance_bot.py
